name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build archive (unsigned)
        run: |
          xcodebuild archive \
            -project DogCare.xcodeproj \
            -scheme DogCare \
            -configuration Release \
            -archivePath build/DogCare.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Export unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DogCare.xcarchive/Products/Applications/DogCare.app build/Payload/
          cd build
          zip -qry DogCare-unsigned.ipa Payload
          ls -la DogCare-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DogCare-unsigned-ipa
          path: build/DogCare-unsigned.ipa
