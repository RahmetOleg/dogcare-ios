name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project DogCare.xcodeproj \
            -scheme DogCare \
            -configuration Release \
            -archivePath build/DogCare.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            2>&1 | tee build.log

      - name: Export unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DogCare.xcarchive/Products/Applications/DogCare.app build/Payload/
          cd build
          zip -qry DogCare-unsigned.ipa Payload
          ls -la DogCare-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DogCare-unsigned-ipa
          path: build/DogCare-unsigned.ipa

      # Диагностика: полный лог сборки — в ветку ci-logs (читается без авторизации),
      # последние ошибки — в summary запуска
      - name: Summarize errors
        if: failure()
        run: |
          {
            echo "## Build errors"
            echo '```'
            grep -E "error:|** BUILD FAILED **|The following build commands failed" build.log | tail -50
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push build log to ci-logs branch
        if: failure()
        run: |
          git config user.name "ci-log-bot"
          git config user.email "ci-log-bot@users.noreply.github.com"
          git add -f build.log
          git commit -m "ci: build log"
          git push origin HEAD:ci-logs --force
